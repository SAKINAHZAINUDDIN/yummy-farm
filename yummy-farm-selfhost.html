<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yummy Farm Words</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#8ccf6e;font-family:Fredoka,"Trebuchet MS",sans-serif;color:#3b2a1a;display:flex;justify-content:center}
.wrap{width:100%;max-width:720px;padding:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#c58b4e;border:4px solid #7a4b22;border-radius:10px;padding:6px 10px;color:#fff8e1;font-weight:700;margin-bottom:8px}
button{font-family:inherit;font-weight:700;cursor:pointer;border:3px solid #7a4b22;background:#ffd54a;color:#3b2a1a;border-radius:10px;padding:6px 12px;font-size:1rem}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid #087da8;outline-offset:2px}
.stage{position:relative}
canvas{width:100%;height:auto;display:block;border:4px solid #7a4b22;border-radius:10px;background:#6bb35a;touch-action:none}
#go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.4rem;padding:14px 22px}
.panel{background:#fff3cf;border:4px solid #7a4b22;border-radius:10px;padding:8px 10px;margin-top:8px}
#say{font-weight:700;font-size:1.1rem;margin:0 0 6px;min-height:1.6em}
.letters{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:60px}
.l{width:44px;text-align:center;background:#fff;border:3px solid #c58b4e;border-radius:8px;padding:2px 0;font-weight:700;transition:transform .15s}
.l b{display:block;font-size:1.5rem}.l small{font-size:.7rem;color:#8a5a2b}
.l.on{background:#ffd54a;border-color:#e08a00;transform:translateY(-4px)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:4px}
.pad button{padding:0;font-size:1.3rem;touch-action:none;user-select:none}
.pad [data-d=u]{grid-column:2}.pad [data-d=l]{grid-row:2;grid-column:1}.pad [data-d=d]{grid-row:2;grid-column:2}.pad [data-d=r]{grid-row:2;grid-column:3}
#act{width:110px;height:110px;border-radius:50%;font-size:1.1rem;touch-action:none}
.hint{font-size:.85rem;text-align:center;margin:6px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#sel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;max-width:420px;max-height:94%;overflow:auto;background:#fff3cf;border:4px solid #7a4b22;border-radius:12px;padding:10px;text-align:center}
#sel h2{margin:0 0 6px;font-size:1.1rem}#sel button{display:block;width:100%;margin:4px 0;font-size:.95rem;padding:6px}
@media print{.wrap>*:not(.stage){display:none!important}.stage canvas{display:none}#sel{position:static;transform:none;width:100%;max-width:none;max-height:none;border:0}#sel button{display:none}body{background:#fff}}
</style></head>
<body><div class="wrap">
<div class="bar"><span>🌾 Yummy Farm Words</span><span>⭐ <span id="stars">0</span></span><span id="day">Day 1 · Morning</span><button id="lvbtn" aria-label="Levels">🗺️</button><button id="snd" aria-pressed="false">🔊</button></div>
<div class="stage"><canvas id="c" width="640" height="416" aria-label="Farm game"></canvas><button id="go" hidden></button><div id="sel"></div></div>
<div class="panel"><p id="say" aria-live="polite">Press start to meet Farmer Pip!</p><div class="letters" id="letters"></div>
<div style="text-align:center"><button id="again">🔊 Sound it out</button></div></div>
<div class="ctl"><div class="pad"><button data-d="u" aria-label="Up">⬆️</button><button data-d="l" aria-label="Left">⬅️</button><button data-d="d" aria-label="Down">⬇️</button><button data-d="r" aria-label="Right">➡️</button></div><button id="act">✋ Pick up / Give</button></div>
<p class="hint">Walk: arrow keys / WASD or the pad · Pick up / Give: Space or the big button</p>
</div>
<script>
const $=id=>document.getElementById(id);
const W=[["Apple","🍎","f"],["Banana","🍌","f"],["Orange","🍊","f"],["Carrot","🥕","v"],["Broccoli","🥦","v"],["Potato","🥔","v"],["Strawberry","🍓","f"],["Grape","🍇","f"],["Watermelon","🍉","f"],["Corn","🌽","v"],["Cucumber","🥒","v"],["Pepper","🫑","v"],["Tomato","🍅","v"],["Mushroom","🍄","v"],["Pineapple","🍍","f"],["Avocado","🥑","f"],["Cherry","🍒","f"],["Peach","🍑","f"],["Garlic","🧄","v"],["Pumpkin","🎃","v"]].map(([n,e,c])=>({n,e,c}));
const TRICKY={Tomato:"A tomato is a fruit in science, but we cook it like a vegetable, so it goes in the veggie cart!",Avocado:"An avocado is a fruit, so it goes in the fruit stand!",Pumpkin:"A pumpkin is cooked like a vegetable, so it goes in the veggie cart!",Mushroom:"A mushroom is cooked with vegetables, so it goes in the veggie cart!"};
const PH={a:"ah",b:"buh",c:"kuh",d:"duh",e:"eh",f:"fff",g:"guh",h:"huh",i:"ih",j:"juh",k:"kuh",l:"lll",m:"mmm",n:"nnn",o:"aw",p:"puh",q:"kwuh",r:"rrr",s:"sss",t:"tuh",u:"uh",v:"vvv",w:"wuh",x:"ks",y:"yuh",z:"zzz"};
const KEY="yummy-farm-v1";let S={stars:0,quests:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(_){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}};
const cv=$("c"),g=cv.getContext("2d"),CW=640,CH=416;
let muted=false,audio=null,voices=[],running=false,quest=null,carry=null,plots=[],fx=[],pl={x:320,y:300,m:0};
const K={},P={},shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const STANDS=[{x:110,y:62,c:"f",e:"🍎",t:"FRUIT STAND",col:"#e53935"},{x:530,y:62,c:"v",e:"🥦",t:"VEGGIE CART",col:"#43a047"}];
const PIP={x:320,y:365};
const FL=Array.from({length:46},(_,i)=>({x:(i*97+23)%CW,y:130+(i*61)%280,c:["#fff","#ffeb3b","#f48fb1"][i%3]}));
/* ---------- voice ---------- */
if(window.speechSynthesis){const lv=()=>{voices=speechSynthesis.getVoices()};lv();speechSynthesis.onvoiceschanged=lv}
function kidVoice(){const en=voices.filter(v=>/^en/i.test(v.lang));
 return en.find(v=>/child|kid|junior/i.test(v.name))||en.find(v=>/samantha|karen|zira|aria|jenny|moira|tessa|fiona|google us english|female/i.test(v.name))||en[0]}
function utter(t,rate){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";const v=kidVoice();if(v)u.voice=v;u.pitch=1.8;u.rate=rate;return u}
function speak(t){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(utter(t,.82))}
function hi(i){document.querySelectorAll(".l").forEach(e=>e.classList.remove("on"));if(i!==undefined)$("L"+i)?.classList.add("on")}
function showLetters(w){$("letters").innerHTML=[...w.n.toUpperCase()].map((c,i)=>`<div class="l" id="L${i}"><b>${c}</b><small>/${PH[c.toLowerCase()]}/</small></div>`).join("")}
function phonics(w){
 showLetters(w);
 const seq=[{t:w.n},...[...w.n.toLowerCase()].map((c,i)=>({t:PH[c],i})),{t:w.n}];
 if(muted||!window.speechSynthesis){seq.forEach((s,k)=>setTimeout(()=>hi(s.i),k*700));return}
 speechSynthesis.cancel();
 seq.forEach(s=>{const u=utter(s.t,s.i===undefined?.75:.6);u.onstart=()=>hi(s.i);speechSynthesis.speak(u)});
}
function tone(ok){if(muted)return;try{audio||=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();
 (ok?[523,659,784]:[190,145]).forEach((f,i)=>{const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+i*.09;o.type=ok?"sine":"triangle";o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(.07,t);v.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+.19)})}catch(_){}}
/* ---------- game ---------- */
function hud(){const q=S.quests%12;$("stars").textContent=S.stars;$("day").textContent=`Day ${Math.floor(S.quests/12)+1} · ${q<4?"Morning":q<8?"Noon":"Evening"}`}
function newRound(){
 const n=Math.min(12,6+2*Math.floor(S.quests/6)),pool=W.slice(0,Math.min(20,6+3*Math.floor(S.quests/4)));
 const spots=[];for(let i=0;i<6;i++)for(const y of[170,250])spots.push({x:70+i*100,y});
 const items=shuffle(pool).slice(0,n);plots=spots.slice(0,n).map((s,i)=>({...s,w:items[i]}));
 quest=items[Math.floor(Math.random()*n)];carry=null;
 const msg=`Please bring me a ${quest.n}!`;$("say").textContent="👨‍🌾 Pip: "+msg;showLetters(quest);speak(msg);hud();
}
function near(){let best=null,d=46;
 const test=(o,x,y,kind)=>{const k=Math.hypot(pl.x-x,pl.y-y);if(k<d){d=k;best={kind,o,x,y}}};
 if(!carry)plots.forEach(p=>p.w&&test(p,p.x,p.y,"plot"));
 STANDS.forEach(s=>test(s,s.x,s.y+34,"stand"));test(PIP,PIP.x,PIP.y,"pip");return best}
function say(t,spk){$("say").textContent=t;if(spk)speak(spk===true?t:spk)}
function act(){
 if(!running)return;const n=near();if(!n)return;
 if(n.kind==="pip"){say(`👨‍🌾 Pip: Please bring me a ${quest.n}!`,`Please bring me a ${quest.n}`);return}
 if(n.kind==="plot"){
  if(n.o.w===quest){carry=quest;n.o.w=null;tone(true);say(`You picked a ${quest.n}! Now put it in the right stand.`);phonics(quest)}
  else{tone(false);say(`That's a ${n.o.w.n}. Pip wants a ${quest.n}!`,`That's a ${n.o.w.n}. Find the ${quest.n}`)}
  return}
 if(n.kind==="stand"&&carry){
  if(n.o.c===carry.c){S.stars++;S.quests++;save();tone(true);for(let i=0;i<10;i++)fx.push({x:n.o.x,y:n.o.y+10,vx:(Math.random()-.5)*3,vy:-1-Math.random()*2,l:40});
   say(`🎉 Yay! ${carry.n} is in the right place! +1 ⭐`,"Yay! Great job!");carry=null;hud();setTimeout(newRound,1600)}
  else{tone(false);const h=TRICKY[carry.n]||`A ${carry.n} goes in the ${n.o.c==="f"?"veggie cart":"fruit stand"}.`;say("🤔 "+h,h)}
 }
}
/* ---------- drawing ---------- */
function person(x,y,shirt,hat,bob){
 g.fillStyle="rgba(0,0,0,.2)";g.beginPath();g.ellipse(x,y+16,11,4,0,0,7);g.fill();
 y+=bob;g.fillStyle="#3b3b8f";g.fillRect(x-6,y+8,5,8);g.fillRect(x+1,y+8,5,8);
 g.fillStyle=shirt;g.fillRect(x-8,y-4,16,13);g.fillStyle="#f2c79b";g.fillRect(x-6,y-14,12,11);
 g.fillStyle="#222";g.fillRect(x-3,y-10,2,2);g.fillRect(x+2,y-10,2,2);
 g.fillStyle=hat;g.fillRect(x-10,y-16,20,4);g.fillRect(x-6,y-22,12,7)}
function draw(t){
 for(let y=0;y<13;y++)for(let x=0;x<20;x++){g.fillStyle=(x+y)%2?"#79c067":"#6fb85f";g.fillRect(x*32,y*32,32,32)}
 FL.forEach(f=>{g.fillStyle=f.c;g.fillRect(f.x,f.y,4,4)});
 g.fillStyle="#c9a066";g.fillRect(0,300,CW,56);g.fillStyle="#b88c56";for(let x=0;x<CW;x+=24)g.fillRect(x,326,12,3);
 g.fillStyle="#3f8fd2";g.beginPath();g.ellipse(320,52,80,40,0,0,7);g.fill();g.fillStyle="#7ec3f0";g.fillRect(290,44,24,3);g.fillRect(330,58,22,3);
 g.fillStyle="#8d6e63";for(let x=0;x<CW;x+=16)g.fillRect(x,CH-8,10,8);
 STANDS.forEach(s=>{g.fillStyle="#7a4b22";g.fillRect(s.x-40,s.y-8,80,34);
  for(let i=0;i<8;i++){g.fillStyle=i%2?"#fff":s.col;g.fillRect(s.x-40+i*10,s.y-28,10,20)}
  g.font="26px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(s.e,s.x,s.y+10);
  g.font="700 11px Fredoka,sans-serif";g.fillStyle="#fff";g.fillText(s.t,s.x,s.y+34)});
 plots.forEach(p=>{g.fillStyle="#7b4b2a";g.fillRect(p.x-24,p.y-20,48,42);g.fillStyle="#5e3820";for(let i=0;i<3;i++)g.fillRect(p.x-22,p.y-12+i*12,44,3);
  if(p.w){g.font="28px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(p.w.e,p.x+Math.sin(t/400+p.x)*1.5,p.y+2)}});
 person(PIP.x,PIP.y,"#4caf50","#f6d55c",0);
 const mv=pl.m?Math.sin(t/90)*2:0;person(pl.x,pl.y,"#e53935","#8d5524",mv);
 g.font="26px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";g.textAlign="center";g.textBaseline="middle";
 if(carry)g.fillText(carry.e,pl.x,pl.y-36+mv);
 const n=running&&near();
 if(n){g.fillStyle="#ffd54a";g.font="700 20px sans-serif";g.fillText("▼",n.x,n.y-30+Math.sin(t/150)*3);
  if(n.kind==="plot"){g.font="700 14px Fredoka,sans-serif";const w=g.measureText(n.o.w.n).width+14;g.fillStyle="rgba(0,0,0,.75)";g.fillRect(n.x-w/2,n.y-58,w,20);g.fillStyle="#fff";g.fillText(n.o.w.n,n.x,n.y-48)}}
 fx=fx.filter(f=>f.l>0);fx.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=.06;f.l--;g.font="18px sans-serif";g.fillText("⭐",f.x,f.y)});
 const q=S.quests%12;if(q>=8){g.fillStyle=`rgba(255,120,40,${.06+(q-8)*.05})`;g.fillRect(0,0,CW,CH)}else if(q<2){g.fillStyle="rgba(255,240,180,.10)";g.fillRect(0,0,CW,CH)}
}
const blocked=(x,y)=>x>232&&x<408&&y<96;
function loop(t){
 if(running){
  const dx=(K.d||K.arrowright||P.r?1:0)-(K.a||K.arrowleft||P.l?1:0),dy=(K.s||K.arrowdown||P.d?1:0)-(K.w||K.arrowup||P.u?1:0);
  pl.m=dx||dy?1:0;
  if(pl.m){const m=Math.hypot(dx,dy),nx=Math.max(16,Math.min(CW-16,pl.x+dx/m*2.5)),ny=Math.max(34,Math.min(CH-22,pl.y+dy/m*2.5));
   if(!blocked(nx,ny)){pl.x=nx;pl.y=ny}else if(!blocked(nx,pl.y))pl.x=nx;else if(!blocked(pl.x,ny))pl.y=ny}
 }
 draw(t);requestAnimationFrame(loop)}
/* ---------- input ---------- */
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 if(k===" "||k==="e"||k==="enter"){if(e.target.tagName!=="BUTTON"||k===" ")act();return}K[k]=1});
addEventListener("keyup",e=>{K[e.key.toLowerCase()]=0});
document.querySelectorAll(".pad button").forEach(b=>{const d=b.dataset.d;
 b.addEventListener("pointerdown",e=>{e.preventDefault();P[d]=1});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{P[d]=0}))});
$("act").addEventListener("click",act);
$("go").addEventListener("click",()=>{$("go").hidden=true;running=true;newRound()});
$("again").addEventListener("click",()=>{if(quest)phonics(quest)});
$("snd").addEventListener("click",()=>{muted=!muted;$("snd").textContent=muted?"🔇":"🔊";$("snd").setAttribute("aria-pressed",String(muted));if(muted)window.speechSynthesis?.cancel()});
</script>
<script>
const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=CW*dpr;cv.height=CH*dpr;
S.unlocked=S.unlocked||1;
const LV=[{n:"Meadow",i:"🌱",pool:6,plots:6,rocks:0,mud:0,hens:0},{n:"Rocky Orchard",i:"🪨",pool:10,plots:8,rocks:4,mud:0,hens:0},{n:"Muddy Field",i:"🟤",pool:14,plots:8,rocks:4,mud:3,hens:0},{n:"Chicken Yard",i:"🐔",pool:17,plots:10,rocks:5,mud:2,hens:3},{n:"Harvest Festival",i:"🏆",pool:20,plots:12,rocks:6,mud:3,hens:4}];
const R=[[190,115],[450,115],[40,205],[600,205],[160,322],[480,322]],M=[[210,211],[430,211],[100,330],[540,330],[320,282]];
const EF="'Segoe UI Emoji','Apple Color Emoji',sans-serif";
let lv=0,base=0,rocks=[],muds=[],hens=[],bg=null,stun=0,vel={x:0,y:0},lastT=0;
function tree(c,x,y,s,k){if(k==='pine')return pine(c,x,y,s);if(k==='palm')return palm(c,x,y,s);c.fillStyle="rgba(0,0,0,.18)";c.beginPath();c.ellipse(x,y+2,16*s,6*s,0,0,7);c.fill();c.fillStyle="#7a4b22";c.fillRect(x-4*s,y-22*s,8*s,24*s);
 [[0,-34,18,CAN[0]],[-10,-26,13,CAN[1]],[10,-27,13,CAN[1]],[-5,-40,8,CAN[2]]].forEach(([a,d,r,k])=>{c.fillStyle=k;c.beginPath();c.arc(x+a*s,y+d*s,r*s,0,7);c.fill()});
 c.fillStyle="#e53935";[[-8,-30],[6,-36],[10,-24]].forEach(([a,d])=>{c.beginPath();c.arc(x+a*s,y+d*s,2.2*s,0,7);c.fill()})}
function rockD(c,x,y){c.fillStyle="rgba(0,0,0,.2)";c.beginPath();c.ellipse(x,y+8,15,5,0,0,7);c.fill();c.fillStyle="#8d949b";c.beginPath();c.ellipse(x,y,15,11,0,0,7);c.fill();c.fillStyle="#b5bcc3";c.beginPath();c.ellipse(x-4,y-4,7,4,0,0,7);c.fill()}
function buildBG(){
 bg=document.createElement("canvas");bg.width=CW*dpr;bg.height=CH*dpr;const c=bg.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
 const T=ZTH||LV[lv].th,gr=T.g;CAN=T.c.length?T.c:CAN;
 for(let y=0;y<13;y++)for(let x=0;x<20;x++){c.fillStyle=gr[(x*7+y*13)%5];c.fillRect(x*32,y*32,32,32)}
 c.strokeStyle="#5fa650";c.lineWidth=1.5;for(let i=0;i<140;i++){const x=(i*53)%CW,y=(i*97)%CH;c.beginPath();c.moveTo(x,y);c.lineTo(x-2,y-5);c.moveTo(x,y);c.lineTo(x+2,y-5);c.stroke()}
 (T.nf?[]:FL).forEach(f=>{c.fillStyle=f.c;[[3,0],[-3,0],[0,3],[0,-3]].forEach(([a,d])=>{c.beginPath();c.arc(f.x+a,f.y+d,2.2,0,7);c.fill()});c.fillStyle="#ffb300";c.beginPath();c.arc(f.x,f.y,1.8,0,7);c.fill()});
 c.fillStyle=T.p;c.fillRect(0,300,CW,56);c.fillStyle=T.p2;c.fillRect(0,300,CW,4);c.fillRect(0,352,CW,4);c.fillStyle="#b88c56";for(let i=0;i<30;i++)c.fillRect((i*83)%CW,306+(i*37)%40,5,3);
 const pg=c.createRadialGradient(320,52,6,320,52,84);pg.addColorStop(0,T.w1);pg.addColorStop(1,T.w2);
 c.fillStyle="#e3c98f";c.beginPath();c.ellipse(320,54,88,46,0,0,7);c.fill();c.fillStyle=pg;c.beginPath();c.ellipse(320,52,80,40,0,0,7);c.fill();
 c.fillStyle="#4caf50";c.beginPath();c.ellipse(350,56,12,6,0,0,7);c.fill();c.fillStyle="#f48fb1";c.beginPath();c.arc(352,54,3,0,7);c.fill();
 c.fillStyle="#a1744a";c.fillRect(0,CH-14,CW,4);for(let x=2;x<CW;x+=18)c.fillRect(x,CH-20,6,18);
 [[22,150,1],[22,255,1.1],[618,150,1],[618,255,1.1],[22,360,1.1],[618,360,1.1]].forEach(a=>tree(c,...a,T.t));
 muds.forEach(([x,y])=>{c.fillStyle="#7b5a3a";c.beginPath();c.ellipse(x,y,32,20,0,0,7);c.fill();c.fillStyle="#936f4a";c.beginPath();c.ellipse(x-6,y-4,16,8,0,0,7);c.fill()});
